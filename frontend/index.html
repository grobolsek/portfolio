  <!-- The colour theme, before the first paint: the visitor's own choice if they made one (localStorage "theme"),
     else the system's, which it keeps following. ThemeToggle.vue changes it. -->
  <script>
    (function () {
      var root = document.documentElement, media = matchMedia('(prefers-color-scheme: dark)');
      function stored() {try {return localStorage.getItem('theme');} catch (e) {return null;} }
      function apply(theme) {
        root.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'dark' ? '#08101b' : '#fbf9f1';
      }
      var s = stored();
      apply(s === 'light' || s === 'dark' ? s : (media.matches ? 'dark' : 'light'));
      media.addEventListener('change', function (e) {if (!stored()) apply(e.matches ? 'dark' : 'light');});
      window.__theme = {apply: apply, system: function () {return media.matches ? 'dark' : 'light';}};
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Palette: navy, cream, warm grey and peach (the owner's reference: 10years.pixelmatters.com), checked with
     start.mjs brand; type: the catalogue's sora pairing (Sora / Figtree), the wide geometric face the reference
     asks for. Dark is the main look; light is the same palette turned over. -->
  <style>
    :root {
      --p-bg: #fbf9f1;
      --p-surface: #f1eee2;
      --p-ink: #08101b;
      --p-muted: #5d5b54;
      --p-accent: #a85a12;
      --p-accent-ink: #fbf9f1;
      --p-action: #a85a12;
      --p-action-ink: #fbf9f1;
      --p-inv-bg: #08101b;
      --p-inv-surface: #151d28;
      --p-inv-ink: #fbf9f1;
      --p-inv-muted: #949798;
      --p-inv-accent: #ffc886;
      --p-inv-accent-ink: #08101b;
      --p-inv-action: #ffc886;
      --p-inv-action-ink: #08101b;
      --font-display: "Sora", system-ui, sans-serif;
      --font-text: "Figtree", system-ui, sans-serif;
      --display-weight: 400;
      --display-tracking: -0.035em;
      --display-tracking-xl: -0.045em;
      --ly-scale: 0.9;
    }

    :root[data-theme="dark"] {
      --p-bg: #08101b;
      --p-surface: #121b27;
      --p-ink: #fffdee;
      --p-muted: #aeaca4;
      --p-accent: #ffc886;
      --p-accent-ink: #08101b;
      --p-action: #ffc886;
      --p-action-ink: #08101b;
      --p-inv-bg: #fffdee;
      --p-inv-surface: #ebeadd;
      --p-inv-ink: #08101b;
      --p-inv-muted: #595f63;
      --p-inv-accent: #08101b;
      --p-inv-accent-ink: #fffdee;
      --p-inv-action: #08101b;
      --p-inv-action-ink: #fffdee;
      color-scheme: dark;
    }

    /* the same for a visitor without script */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --p-bg: #08101b;
        --p-surface: #121b27;
        --p-ink: #fffdee;
        --p-muted: #aeaca4;
        --p-accent: #ffc886;
        --p-accent-ink: #08101b;
        --p-action: #ffc886;
        --p-action-ink: #08101b;
        --p-inv-bg: #fffdee;
        --p-inv-surface: #ebeadd;
        --p-inv-ink: #08101b;
        --p-inv-muted: #595f63;
        --p-inv-accent: #08101b;
        --p-inv-accent-ink: #fffdee;
        --p-inv-action: #08101b;
        --p-inv-action-ink: #fffdee;
        color-scheme: dark;
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
    }
  </style>
  <script>document.documentElement.classList.add('m-enter'); setTimeout(() => document.documentElement.classList.add('m-enter-done'), 700)</script>
