# HTTPS in production: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# Caddy gets Let's Encrypt certificates for DOMAIN (set it in .env) and proxies to the frontend.
services:
  frontend:
    ports: !reset []

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/portfolio}/caddy/data:/data
      - ${DATA_DIR:-/portfolio}/caddy/config:/config
